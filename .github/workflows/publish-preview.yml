name: Publish Preview

on:
  workflow_dispatch:
    inputs:
      run-id:
        type: string
        required: true
      head-branch:
        type: string
        required: true
  workflow_run:
    workflows: [Preview Documentation]
    types: [completed]

concurrency:
  group: doc-preview-push
  queue: max

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      pull-requests: read
    outputs:
      publish: ${{ steps.state.outputs.publish }}
    steps:
      # A pull request that closed while its preview was building has had
      # its preview removed already, so publishing now would leave one that
      # nothing removes.
      - id: state
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head-branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case $(gh pr view "$BRANCH" -R "$GITHUB_REPOSITORY" --json state --jq .state || true) in
            CLOSED|MERGED) echo "publish=false" ;;
            *) echo "publish=true" ;;
          esac >> "$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.publish == 'true' }}
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/doc-preview
          token: ${{ secrets.ACCESS_TOKEN }}
      - id: dir
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head-branch }}
        run: dir=${BRANCH//[\/]/-}; rm -rf "$dir"; echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.ACCESS_TOKEN }} # github.token won't work since artifact download is scoped even with permissions
          run-id: ${{ github.event.workflow_run.id || inputs.run-id }}
          name: docs_
          path: ${{ steps.dir.outputs.dir }}
      - name: Keep every preview out of search
        # Previews are copies of the documentation, which is indexed on
        # 51degrees.com, so no preview page may be indexed. Runs over every
        # preview in the repository, so older previews are fixed too.
        run: |
          find . -path ./.git -prune -o -name '*.html' -print0 |
            while IFS= read -r -d '' f; do
              sed -i -E '/<link[^>]*rel="canonical"[^>]*>/d; /<link[^>]*rel="alternate"[^>]*hreflang=[^>]*>/d' "$f"
              grep -q -i '<meta[^>]*name="robots"' "$f" ||
                sed -i -E '0,/<head( [^>]*)?>/s//&\n<meta name="robots" content="noindex">/' "$f"
            done
      # The push replaces the repository's single commit, and the shared
      # concurrency group runs one push at a time, so a refused push fails
      # the run rather than posting a link to a preview that is not there.
      - name: Publish preview
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || inputs.head-branch }}
          DIR: ${{ steps.dir.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          touch .nojekyll
          git add .
          git -c user.name=Automation51D -c user.email=60396166+Automation51D@users.noreply.github.com commit --amend --no-edit --reset-author
          git push --force-with-lease
          gh pr comment "$BRANCH" -R "$GITHUB_REPOSITORY" --edit-last --create-if-none --body \
            "[Documentation preview](https://51degrees.github.io/doc-preview/$(printf '%s\n' "$DIR"/[0-9]*/ | sort -V | tail -n1)) 👀"
