<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-label="How PMP loads and answers. The page fetches the loader from the 51Degrees cloud, and the loader fetches the bundle for the visitor's language, which is the request that is checked against the resource key's domains and counted. The bundle reads the two PMP cookies and, where the answer is shared or none is held, asks the cloud for the group's answer. With no answer anywhere it shows the first card. The visitor's answer is saved to the __mtm_pref cookie and announced on the window, the 51Degrees client script hears it and sends it to the cloud as id.usage with its next request, and the cloud returns the 51Did. Where sharing is configured and third party cookies are confirmed, a second card offers to use the answer across the group, which the bundle stores with the cloud. On later visits the stored answer is announced and only the bubble is shown.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232628"/>
    </marker>
  </defs>
  <style>
    text { font-family: Calibri, "Segoe UI", Arial, sans-serif; fill: #232628; }
    .head { font-size: 16px; font-weight: bold; }
    .label { font-size: 13px; }
    .step { font-size: 13px; font-weight: bold; fill: #E62D39; }
    .note { font-size: 12px; fill: #555555; }
    .box { fill: #ffffff; stroke: #232628; stroke-width: 1.5; }
    .life { stroke: #919191; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .msg { stroke: #232628; stroke-width: 1.5; fill: none; }
    .label, .note, .step { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <rect class="box" x="15" y="24" width="170" height="44" rx="4"/>
  <text class="head" x="100" y="52" text-anchor="middle">Visitor's browser</text>
  <rect class="box" x="265" y="24" width="170" height="44" rx="4"/>
  <text class="head" x="350" y="52" text-anchor="middle">PMP</text>
  <rect class="box" x="525" y="24" width="170" height="44" rx="4"/>
  <text class="head" x="610" y="52" text-anchor="middle">Client script</text>
  <rect class="box" x="775" y="24" width="170" height="44" rx="4"/>
  <text class="head" x="860" y="52" text-anchor="middle">51Degrees cloud</text>
  <line class="life" x1="100" y1="68" x2="100" y2="760"/>
  <line class="life" x1="350" y1="68" x2="350" y2="760"/>
  <line class="life" x1="610" y1="68" x2="610" y2="760"/>
  <line class="life" x1="860" y1="68" x2="860" y2="760"/>

  <text class="step" x="110" y="96">Step one, loading</text>
  <line class="msg" x1="100" y1="122" x2="858" y2="122" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="115" text-anchor="middle">GET /api/v4/pmp/&lt;key&gt;.js, the loader, neither checked nor counted</text>
  <line class="msg" x1="350" y1="160" x2="858" y2="160" marker-end="url(#arrow)"/>
  <text class="label" x="605" y="153" text-anchor="middle">GET /api/v4/pmp/&lt;key&gt;/&lt;language&gt;, the bundle, checked and counted</text>
  <line class="msg" x1="860" y1="196" x2="352" y2="196" marker-end="url(#arrow)"/>
  <text class="label" x="605" y="189" text-anchor="middle">The bundle for the visitor's language</text>

  <text class="step" x="110" y="238">Step two, any answer already held</text>
  <text class="note" x="360" y="262">Reads the __mtm_pref and __51d_pmp_share cookies</text>
  <line class="msg" x1="350" y1="296" x2="858" y2="296" marker-end="url(#arrow)"/>
  <text class="label" x="605" y="289" text-anchor="middle">GET /api/v4/pmp/pref, where the answer is shared or none is held</text>
  <line class="msg" x1="860" y1="330" x2="352" y2="330" marker-end="url(#arrow)"/>
  <text class="label" x="605" y="323" text-anchor="middle">The group's answer, or none</text>

  <text class="step" x="110" y="372">Step three, with no answer anywhere</text>
  <line class="msg" x1="350" y1="398" x2="102" y2="398" marker-end="url(#arrow)"/>
  <text class="label" x="225" y="391" text-anchor="middle">The first card</text>
  <line class="msg" x1="100" y1="434" x2="348" y2="434" marker-end="url(#arrow)"/>
  <text class="label" x="225" y="427" text-anchor="middle">Personalized, Standard or the alternative</text>

  <text class="step" x="110" y="476">Step four, the answer reaches the cloud</text>
  <text class="note" x="360" y="500">Saves __mtm_pref and announces 51d-pmp-preference on the window</text>
  <line class="msg" x1="350" y1="532" x2="608" y2="532" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="525" text-anchor="middle">51d-pmp-preference</text>
  <line class="msg" x1="610" y1="568" x2="858" y2="568" marker-end="url(#arrow)"/>
  <text class="label" x="735" y="561" text-anchor="middle">The next request, with id.usage</text>
  <line class="msg" x1="860" y1="604" x2="612" y2="604" marker-end="url(#arrow)"/>
  <text class="label" x="735" y="597" text-anchor="middle">The 51Did</text>

  <text class="step" x="110" y="646">Step five, sharing, where configured</text>
  <line class="msg" x1="350" y1="672" x2="102" y2="672" marker-end="url(#arrow)"/>
  <text class="label" x="225" y="665" text-anchor="middle">The second card</text>
  <line class="msg" x1="100" y1="706" x2="348" y2="706" marker-end="url(#arrow)"/>
  <text class="label" x="225" y="699" text-anchor="middle">Use the answer across the group</text>
  <line class="msg" x1="350" y1="740" x2="858" y2="740" marker-end="url(#arrow)"/>
  <text class="label" x="605" y="733" text-anchor="middle">POST /api/v4/pmp/pref</text>

  <text class="note" x="480" y="788" text-anchor="middle">On later visits steps three to five are skipped. The stored answer is announced and only the bubble is shown.</text>
</svg>
