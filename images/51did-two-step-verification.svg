<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Two-step creator context verification. The visitor's browser asks the 51Degrees cloud to verify the 51Did and receives a sealed result it cannot read. It passes the 51Did and the sealed result to the customer's server in an ordinary request. The server redeems the sealed result with the cloud, using its licence key, within ten seconds, and receives the verdict.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232628"/>
    </marker>
  </defs>
  <style>
    text { font-family: Calibri, "Segoe UI", Arial, sans-serif; fill: #232628; }
    .head { font-size: 16px; font-weight: bold; }
    .label { font-size: 13px; }
    .step { font-size: 13px; font-weight: bold; fill: #E62D39; }
    .note { font-size: 12px; fill: #555555; }
    .box { fill: #ffffff; stroke: #232628; stroke-width: 1.5; }
    .life { stroke: #919191; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .msg { stroke: #232628; stroke-width: 1.5; fill: none; }
    .label, .note, .step { paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
  </style>
  <rect class="box" x="40" y="24" width="180" height="44" rx="4"/>
  <text class="head" x="130" y="52" text-anchor="middle">Visitor's browser</text>
  <rect class="box" x="390" y="24" width="180" height="44" rx="4"/>
  <text class="head" x="480" y="52" text-anchor="middle">51Degrees cloud</text>
  <rect class="box" x="740" y="24" width="180" height="44" rx="4"/>
  <text class="head" x="830" y="52" text-anchor="middle">Your server</text>
  <line class="life" x1="130" y1="68" x2="130" y2="380"/>
  <line class="life" x1="480" y1="68" x2="480" y2="380"/>
  <line class="life" x1="830" y1="68" x2="830" y2="380"/>
  <text class="step" x="140" y="100">Step one</text>
  <line class="msg" x1="130" y1="120" x2="478" y2="120" marker-end="url(#arrow)"/>
  <text class="label" x="304" y="113" text-anchor="middle">verify-context with the 51Did and the Resource Key</text>
  <line class="msg" x1="480" y1="165" x2="132" y2="165" marker-end="url(#arrow)"/>
  <text class="label" x="304" y="158" text-anchor="middle">{ "result": "..." } sealed, unreadable in the browser</text>
  <line class="msg" x1="130" y1="225" x2="828" y2="225" marker-end="url(#arrow)"/>
  <text class="label" x="480" y="218" text-anchor="middle">Ordinary request to your server carrying the 51Did and the sealed result</text>
  <text class="step" x="600" y="270">Step two</text>
  <line class="msg" x1="830" y1="290" x2="482" y2="290" marker-end="url(#arrow)"/>
  <text class="label" x="655" y="283" text-anchor="middle">redeem with the 51Did, the sealed result and your licence key</text>
  <text class="note" x="655" y="306" text-anchor="middle">within ten seconds of step one, once only</text>
  <line class="msg" x1="480" y1="345" x2="828" y2="345" marker-end="url(#arrow)"/>
  <text class="label" x="655" y="338" text-anchor="middle">verified, or mismatch naming the factor that differed</text>
</svg>
